<html lang="ja">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style id="css">
/* Layout: counts, quick check for today, month calendar with "ジム" band and parts, then the selected day as a memo (parts, exercises, edit form), then backup */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#1b2230; --muted:#667085; --line:#dde2ea;
  --accent:#2f5fd0; --on-accent:#ffffff; --accent-soft:#e2e9fa; --sun:#c0582b; --good:#1f8a4c; --good-soft:#e1f3e8;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1b212b; --ink:#e7ebf2; --muted:#98a2b3; --line:#2c3441;
  --accent:#6f93ee; --on-accent:#0f1420; --accent-soft:#232f4a; --sun:#ec9a72; --good:#5fcf8f; --good-soft:#1d3a2a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1b212b; --ink:#e7ebf2; --muted:#98a2b3; --line:#2c3441;
  --accent:#6f93ee; --on-accent:#0f1420; --accent-soft:#232f4a; --sun:#ec9a72; --good:#5fcf8f; --good-soft:#1d3a2a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
#app{max-width:720px;margin:0 auto;padding:28px 16px 60px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:1.7rem;margin:0;line-height:1.2}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pill b{display:block;font-family:var(--display);font-size:1.3rem;color:var(--ink);line-height:1.2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:12px}
.card .when{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card .when button{font:inherit;font-size:.85rem;background:none;border:none;color:var(--accent);cursor:pointer;padding:0}
.check{font:inherit;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:16px;border-radius:12px;border:2px dashed var(--accent);background:var(--surface);color:var(--accent);font-family:var(--display);font-size:1.15rem;cursor:pointer}
.check .box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid currentColor;display:grid;place-items:center}
.check.done{border-style:solid;background:var(--accent);color:var(--on-accent)}
.check.done .box::after{content:"";width:8px;height:14px;border:solid currentColor;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.plabel{font-size:.85rem;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.95rem;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.chip.add{color:var(--muted);border-style:dashed;background:transparent}
.addpart{display:flex;gap:8px;margin-top:8px}
.addpart input{font:inherit;flex:1;min-width:0;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.addpart button{font:inherit;padding:7px 14px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer}
.logs{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.ent{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.ent .nm{font-weight:700;overflow-wrap:anywhere}
.ent .dt{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ent button{font:inherit;font-size:.8rem;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 6px;white-space:nowrap}
.noent{font-size:.9rem;color:var(--muted);margin:0}
.entform{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.frow{display:flex;gap:8px;flex-wrap:wrap}
.entform label{display:flex;flex-direction:column;font-size:.75rem;color:var(--muted);gap:2px}
.entform label.grow{flex:1;min-width:150px}
.entform input{font:inherit;font-size:1rem;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.entform input.num{width:80px}
.entform .prev{font-size:.8rem;color:var(--muted);min-height:1.2em}
.entform button[type=submit]{font:inherit;align-self:flex-start;padding:8px 16px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer}
.ent .cnt{font-size:.75rem;font-weight:500;color:var(--muted);margin-left:8px}
.setlist{margin:2px 0 0;padding-left:1.6em;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.setrow .sn{font-size:.8rem;color:var(--muted);width:4.5em;padding-bottom:10px}
.setrow .rm{font:inherit;width:34px;height:38px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.addset,.copyprev{font:inherit;font-size:.85rem;align-self:flex-start;padding:5px 12px;border-radius:999px;border:1px dashed var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.copyprev{margin-left:6px;padding:2px 10px;font-size:.8rem}
.dayttl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dayttl h2{margin:0;font-family:var(--display);font-size:1.2rem;display:flex;align-items:center;gap:8px}
.dayttl .tg{font-family:var(--body);font-size:.75rem;background:var(--ink);color:var(--surface);border-radius:999px;padding:1px 8px}
.link{font:inherit;font-size:.85rem;background:none;border:none;color:var(--accent);cursor:pointer;padding:2px 4px}
.link.danger{color:var(--sun);margin-left:auto}
.primary{font:inherit;align-self:flex-start;padding:9px 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer}
.memo{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.memo .plabel{margin:0}
.memolist{list-style:none;margin:0;padding:4px 16px;background:var(--bg);border-radius:10px;border-left:4px solid var(--accent)}
.memolist li{padding:10px 0;border-bottom:1px dashed var(--line)}
.memolist li:last-child{border-bottom:none}
.memolist li.editing .mn{color:var(--accent)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mn{font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.ml{font-size:.95rem;font-variant-numeric:tabular-nums;padding-left:1em;overflow-wrap:anywhere}
.ml.note{color:var(--muted)}
.entform{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.entform .plabel{margin:0;font-weight:700;color:var(--ink)}
.entform .frow{align-items:center}
.backup h2{margin:0 0 4px;font-size:1rem}
.note2{font-size:.85rem;color:var(--muted);margin:0 0 10px}
.backup .frow{display:flex;gap:8px;flex-wrap:wrap}
#bkmsg{margin:8px 0 0}
.loading{color:var(--muted);text-align:center;padding:40px 0;margin:0}
.filebtn{display:inline-flex;align-items:center;cursor:pointer;position:relative}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.backup .notice{margin-top:10px}
.mstats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:stretch}
.ms{flex:1;min-width:130px;background:var(--accent-soft);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column}
.ml2{font-size:.78rem;color:var(--muted)}
.ms b{font-family:var(--display);font-size:1.5rem;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums}
.ms small{font-size:.8rem;margin-left:2px}
.msnote{flex-basis:100%;margin:0;font-size:.75rem;color:var(--muted)}
.plabel2{font-size:.8rem;color:var(--muted);margin:0 0 6px}
.cmpline{font-size:.85rem;padding-left:1em;font-variant-numeric:tabular-nums;font-weight:700}
.cmpline.up{color:var(--good)}.cmpline.down{color:var(--sun)}.cmpline.same{color:var(--muted);font-weight:500}
.exsec h2{margin:0 0 10px;font-size:1rem}
.exsum{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 4px;font-size:.9rem;color:var(--muted)}
.exsum b{color:var(--ink);font-family:var(--display);font-size:1.05rem}
.chartwrap{margin:10px 0 6px}
.chartwrap svg{width:100%;height:auto;display:block}
.cg{stroke:var(--line);stroke-width:1}.ct{fill:var(--muted);font-size:12px;font-family:var(--body)}
.cl{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ca{fill:var(--accent-soft);opacity:.7}.cd{fill:var(--accent)}.cpb{fill:var(--good);stroke:var(--surface);stroke-width:2}
.hint2{font-size:.8rem;color:var(--muted);margin:6px 0}
.exlist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.exlist li{display:grid;grid-template-columns:5.2em 1fr auto auto;gap:4px 10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);border-radius:6px}
.exlist li.picked{background:var(--accent-soft)}
.exlist .goto{text-align:left;font-variant-numeric:tabular-nums;padding:0}
.exd{font-size:.9rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.exm{display:block;color:var(--muted);font-size:.8rem}
.cmpchip{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cmpchip.up{background:var(--good-soft);color:var(--good)}.cmpchip.down{background:var(--bg);color:var(--sun)}.cmpchip.same{background:var(--bg);color:var(--muted);font-weight:500}.cmpchip.none{padding:0}
.cmpbtn{font:inherit;font-size:.78rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.cmpbtn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.cmpbox{border:1px solid var(--accent);border-radius:10px;padding:12px;margin:10px 0}
.cmphead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tablewrap{overflow-x:auto}
.cmptable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem;min-width:300px}
.cmptable th,.cmptable td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmptable thead th{font-size:.8rem;color:var(--muted);font-weight:500}
.cmptable tbody th{font-weight:500;color:var(--muted);font-size:.82rem;white-space:nowrap}
.cmptable td.sm{font-size:.82rem}
.exmanage{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px}
#renForm{margin-top:12px}
@media (max-width:480px){.exlist li{grid-template-columns:4.6em 1fr auto}.exlist .cmpchip{grid-column:2}.exlist .cmpbtn{grid-column:3;grid-row:1}}
.warn{font-size:.85rem;color:var(--sun);margin:0;text-align:center}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.monthbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.monthbar h2{margin:0;font-family:var(--display);font-size:1.2rem}
.nav{font:inherit;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;width:38px;height:34px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 44px;gap:4px}
.wd{font-size:.75rem;color:var(--muted);text-align:center}
.wd.sun{color:var(--sun)}
.day{min-height:66px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:4px;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;min-width:0}
.day:hover{border-color:var(--accent)}
.day.other{opacity:.4}
.day.future{cursor:default;background:var(--bg)}
.day.future:hover{border-color:var(--line)}
.day.sel{outline:2px solid var(--accent);outline-offset:1px}
.day .n{font-size:.8rem;font-variant-numeric:tabular-nums;align-self:flex-start;min-width:22px;text-align:center;border-radius:999px}
.day.today .n{background:var(--ink);color:var(--surface)}
.marks{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;min-width:0}
.band{background:var(--accent);color:var(--on-accent);font-size:.75rem;font-weight:700;line-height:1;padding:4px 5px;border-radius:4px;white-space:nowrap}
.parts{font-size:.68rem;font-weight:700;color:var(--accent);line-height:1.25;overflow-wrap:anywhere;min-width:0}
.wk{display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);text-align:center;line-height:1.2;font-variant-numeric:tabular-nums}
.wk b{font-family:var(--display);font-size:1rem;color:var(--ink)}
.wk.zero b{color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted);margin:10px 0 0}
.tally{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:.9rem;font-variant-numeric:tabular-nums}
.tally .t{color:var(--muted)}
.tally b{color:var(--ink)}
.notice{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:.9rem}
.ghost{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:9px;background:transparent;color:var(--muted);border:1px solid var(--line);cursor:pointer}
.status{font-size:.8rem;color:var(--muted);text-align:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:480px){.cal{grid-template-columns:repeat(7,minmax(0,1fr)) 34px;gap:3px}.day{min-height:58px;padding:3px}.band{font-size:.66rem;padding:3px 2px;text-align:center;width:100%}.parts{font-size:.6rem}}
@media (prefers-reduced-motion:no-preference){.day,.check,.chip{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div id="app"></div>
<script id="appjs">
(function(){
  var state={days:{},logs:{},parts:null,sample:false};
  var ready=false, loadFail='', saveTimer=null, statusMsg='', adding=false, confirmUncheck=false, exSel=null, cmp=[], renaming=false, confirmExRemove=false, formOpen=false, editIdx=-1, importArmed=false, pendingImport=null;
  var dirty={}, writing=false, localOnly=false;
  var draft={n:'',sets:[{kg:'',r:''}],memo:''};
  function resetDraft(){draft={n:'',sets:[{kg:'',r:''}],memo:''};}
  // Each exercise keeps one row per set; older entries stored kg/r/s once
  function setsOf(e){if(e.sets)return e.sets;if(e.kg==null&&!e.r)return [];var a=[];for(var i=0;i<(e.s||1);i++)a.push({kg:e.kg,r:e.r});return a;}
  function fmtSet(x){return [(x.kg!=null?(Math.round(x.kg*10)/10)+'kg':''),(x.r?x.r+'回':'')].filter(Boolean).join(' × ');}
  function setsText(e){var s=setsOf(e),out=[],i=0;
    while(i<s.length){var j=i;while(j+1<s.length&&s[j+1].kg===s[i].kg&&s[j+1].r===s[i].r)j++;var t=fmtSet(s[i]);if(t)out.push(t+(j>i?' × '+(j-i+1)+'セット':''));i=j+1;}
    return out.join('、');}
  function detail(e){var t=setsText(e);return t+(e.memo?(t?'　':'')+e.memo:'');}
  // One "session" = everything done for one exercise on one day
  function sessionsOf(n){var out=[];Object.keys(state.logs).sort().forEach(function(k){var ss=[],memo=[];
      state.logs[k].forEach(function(e){if(e.n===n){ss=ss.concat(setsOf(e));if(e.memo)memo.push(e.memo);}});
      if(ss.length||memo.length)out.push({k:k,e:{n:n,sets:ss,memo:memo.join(' ')}});});return out;}
  function prevSession(n,before){var s=sessionsOf(n).filter(function(x){return x.k<before;});return s.length?s[s.length-1]:null;}
  function bestOf(e){var b=null;setsOf(e).forEach(function(x){if(!b){b=x;return;}var bk=b.kg==null?-1:b.kg,xk=x.kg==null?-1:x.kg;
      if(xk>bk||(xk===bk&&(x.r||0)>(b.r||0)))b=x;});return b;}
  // Compare the best set: weight first; if the weight is the same, reps
  function diffOf(cur,prev){var a=bestOf(cur),b=bestOf(prev);if(!a||!b)return null;
    var ak=a.kg==null?null:a.kg,bk=b.kg==null?null:b.kg;
    if(ak!=null&&bk!=null&&ak!==bk){var d=Math.round((ak-bk)*10)/10;return {t:(d>0?'+':'')+d+'kg',c:d>0?'up':'down'};}
    if(ak===bk&&(a.r||0)!==(b.r||0)){var r=(a.r||0)-(b.r||0);return {t:(ak!=null?(Math.round(ak*10)/10)+'kgで':'')+(r>0?'+':'')+r+'回',c:r>0?'up':'down'};}
    if(ak===bk)return {t:'前回と同じ',c:'same'};return null;}
  function mdk(k){return (+k.slice(5,7))+'/'+(+k.slice(8));}
  function lastOf(n,before){var ks=Object.keys(state.logs).filter(function(k){return k<before;}).sort().reverse();
    for(var i=0;i<ks.length;i++){var l=state.logs[ks[i]];for(var j=l.length-1;j>=0;j--)if(l[j].n===n)return {k:ks[i],e:l[j]};}return null;}
  var WD=['日','月','火','水','木','金','土'];
  var DEFAULT_PARTS=['脚','胸','背中','お尻','肩','腕','お腹','有酸素'];
  function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function parse(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  var today=new Date();today.setHours(0,0,0,0);var TODAY=key(today);
  var view=new Date(today.getFullYear(),today.getMonth(),1), sel=TODAY;

  function normalize(){
    if(!state.days)state.days={};
    if(!state.parts)state.parts=DEFAULT_PARTS.slice();
    if(!state.logs)state.logs={};
    if(!Array.isArray(state.exercises))state.exercises=[];
    Object.keys(state.logs).sort().forEach(function(k){(state.logs[k]||[]).forEach(function(e){if(e.n&&state.exercises.indexOf(e.n)<0)state.exercises.push(e.n);});});
    Object.keys(state.days).forEach(function(k){if(!Array.isArray(state.days[k]))state.days[k]=[];});
  }
  normalize();

  /* Storage: records are kept in this browser (localStorage) on each person's own device.
     Back up with the CSV button; the same CSV can be read back in. */
  var KEY='gym-log-v1', storageOk=true;
  function loadLocal(){try{var s=localStorage.getItem(KEY);if(s){state=JSON.parse(s);normalize();}}catch(e){storageOk=false;}}
  function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state));statusMsg='';}catch(e){storageOk=false;statusMsg='このブラウザでは保存できませんでした。プライベートブラウズを使っていないか確かめてください。';}}
  function changed(){saveLocal();render();}
  function start(){loadLocal();ready=true;render();}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function count(a,b){var n=0;for(var d=new Date(a);d<=b;d=addDays(d,1))if(state.days[key(d)])n++;return n;}
  function md(d){return (d.getMonth()+1)+'月'+d.getDate()+'日';}

  function render(){
    var h='',wkStart=addDays(today,-today.getDay()),ms=new Date(today.getFullYear(),today.getMonth(),1);

  function exChart(S,pb){
    var P=S.map(function(x){var b=bestOf(x.e);return b&&b.kg!=null?{k:x.k,v:b.kg}:null;}).filter(Boolean);
    if(P.length<2)return '';
    var W=600,H=170,l=44,r=14,tp=14,bt=28,mn=Math.min.apply(null,P.map(function(p){return p.v;})),mx=Math.max.apply(null,P.map(function(p){return p.v;}));
    if(mn===mx){mn-=5;mx+=5;}var pad=(mx-mn)*0.1;mn=Math.max(0,mn-pad);mx+=pad;
    function X(i){return l+i*(W-l-r)/(P.length-1);}function Y(v){return tp+(1-(v-mn)/(mx-mn))*(H-tp-bt);}
    var pts=P.map(function(p,i){return X(i).toFixed(1)+','+Y(p.v).toFixed(1);}).join(' ');
    var g='',ticks=[mn,(mn+mx)/2,mx];ticks.forEach(function(v){g+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" class="cg"/><text x="'+(l-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" class="ct">'+(Math.round(v*10)/10)+'</text>';});
    var dots=P.map(function(p,i){var isPb=pb&&p.k===pb.k;return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(isPb?5:3)+'" class="'+(isPb?'cpb':'cd')+'"><title>'+mdk(p.k)+' '+p.v+'kg</title></circle>';}).join('');
    var area='<polygon points="'+X(0).toFixed(1)+','+(H-bt)+' '+pts+' '+X(P.length-1).toFixed(1)+','+(H-bt)+'" class="ca"/>';
    return '<div class="chartwrap"><p class="plabel2">その日いちばん重かったセット（kg）</p><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(exSel)+'の重さの推移">'+g+area+'<polyline points="'+pts+'" class="cl"/>'+dots+
      '<text x="'+X(0)+'" y="'+(H-8)+'" class="ct" text-anchor="start">'+mdk(P[0].k)+'</text><text x="'+X(P.length-1)+'" y="'+(H-8)+'" class="ct" text-anchor="end">'+mdk(P[P.length-1].k)+'</text></svg></div>';
  }

  function parseCsv(text){
    text=text.replace(/^\uFEFF/,'');var rows=[],row=[],cell='',q=false;
    for(var i=0;i<text.length;i++){var c=text[i];
      if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
      else if(c==='"')q=true;else if(c===','){row.push(cell);cell='';}
      else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
      else cell+=c;}
    if(cell!==''||row.length){row.push(cell);rows.push(row);}
    var days={},logs={},cur={};
    rows.slice(1).forEach(function(r){var k=(r[0]||'').trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return;
      days[k]=(r[2]||'').split('・').filter(Boolean);var n=(r[3]||'').trim();if(!n)return;
      var L=logs[k]=logs[k]||[],set=+r[4]||0;
      if(set<=1||!cur[k]||cur[k].n!==n){cur[k]={n:n};L.push(cur[k]);}
      var e=cur[k],o={};if((r[5]||'').trim()!=='')o.kg=+r[5];if((r[6]||'').trim()!=='')o.r=+r[6];
      if(set&&(o.kg!=null||o.r!=null))(e.sets=e.sets||[]).push(o);if((r[7]||'').trim())e.memo=(e.memo?e.memo+' ':'')+r[7].trim();});
    return {days:days,logs:logs};
  }
  document.addEventListener('change',function(e){if(e.target.id!=='csvIn')return;var f=e.target.files&&e.target.files[0];if(!f)return;
    var rd=new FileReader();rd.onload=function(){try{var p=parseCsv(String(rd.result));if(!Object.keys(p.days).length){bk('記録が見つかりませんでした。このページで保存したCSVを選んでください。');return;}pendingImport=p;render();}catch(err){bk('読み込めませんでした。');}};rd.readAsText(f);});
  function bk(msg){var el=document.getElementById('bkmsg');if(el)el.textContent=msg;}

  document.addEventListener('click',function(e){var t;
    if((t=e.target.closest('[data-day]'))){if(sel!==t.dataset.day)closeForm();sel=t.dataset.day;adding=false;confirmUncheck=false;render();showCard();return;}
    if(e.target.closest('#checkToday')){toggleDay(TODAY);return;}
    if(e.target.closest('#check')){toggleDay(sel);return;}
    if((t=e.target.closest('[data-delent]'))){if(t.dataset.c==='0'){t.dataset.c='1';t.textContent='本当に消す';return;}
      var l=state.logs[sel];l.splice(+t.dataset.delent,1);if(!l.length)delete state.logs[sel];closeForm();changed();return;}
    if((t=e.target.closest('[data-edit]'))){var i=+t.dataset.edit,en=state.logs[sel][i];
      editIdx=i;formOpen=true;draft={n:en.n,memo:en.memo||'',sets:setsOf(en).map(function(x){return {kg:x.kg==null?'':String(x.kg),r:x.r?String(x.r):''};})};
      if(!draft.sets.length)draft.sets=[{kg:'',r:''}];render();var f=document.getElementById('entForm');if(f)f.scrollIntoView({block:'nearest'});return;}
    if((t=e.target.closest('[data-ex]'))){draft.n=t.dataset.ex;render();var pv=document.getElementById('e-prev');if(pv)pv.scrollIntoView({block:'nearest'});return;}
    if((t=e.target.closest('[data-exsel]'))){exSel=t.dataset.exsel;cmp=[];renaming=false;confirmExRemove=false;render();return;}
    if((t=e.target.closest('[data-cmp]'))){var ck=t.dataset.cmp,ci=cmp.indexOf(ck);if(ci>=0)cmp.splice(ci,1);else{cmp.push(ck);if(cmp.length>2)cmp.shift();}render();
      if(cmp.length===2){var bx=document.querySelector('.cmpbox');if(bx)bx.scrollIntoView({block:'nearest'});}return;}
    if(e.target.id==='cmpClear'){cmp=[];render();return;}
    if((t=e.target.closest('[data-goto]'))){var gk=t.dataset.goto,gd=parse(gk);closeForm();sel=gk;view=new Date(gd.getFullYear(),gd.getMonth(),1);render();showCard();return;}
    if(e.target.id==='renOpen'){renaming=true;confirmExRemove=false;render();var rn=document.getElementById('renName');if(rn){rn.focus();rn.select();}return;}
    if(e.target.id==='renCancel'){renaming=false;render();return;}
    if(e.target.id==='exRemove'){if(!confirmExRemove){confirmExRemove=true;render();return;}
      state.exercises=state.exercises.filter(function(n){return n!==exSel;});exSel=null;cmp=[];confirmExRemove=false;changed();return;}
    if(e.target.id==='openForm'){closeForm();formOpen=true;render();var n=document.getElementById('e-n');if(n)n.focus();return;}
    if(e.target.id==='cancelForm'){closeForm();render();return;}
    if((t=e.target.closest('[data-part]'))){var a=state.days[sel],p=t.dataset.part,pi=a.indexOf(p);if(pi>=0)a.splice(pi,1);else a.push(p);
      a.sort(function(x,y){return state.parts.indexOf(x)-state.parts.indexOf(y);});changed();return;}
    if(e.target.id==='addOpen'){adding=true;render();return;}
    if(e.target.id==='prev'){view=new Date(view.getFullYear(),view.getMonth()-1,1);render();return;}
    if(e.target.id==='next'){view=new Date(view.getFullYear(),view.getMonth()+1,1);render();return;}
    if(e.target.id==='clearSample'){state.sample=false;state.days={};state.logs={};closeForm();changed();return;}
    if(e.target.id==='addSet'){var ls=draft.sets[draft.sets.length-1];draft.sets.push({kg:ls.kg,r:ls.r});render();focusSet(draft.sets.length-1);return;}
    if((t=e.target.closest('[data-rmset]'))){draft.sets.splice(+t.dataset.rmset,1);render();return;}
    if(e.target.id==='copyPrev'){var r=lastOf(draft.n,sel);if(r){draft.sets=setsOf(r.e).map(function(x){return {kg:x.kg==null?'':String(x.kg),r:x.r?String(x.r):''};});render();focusSet(0);}return;}
    if(e.target.id==='copyText'){var txt=allText();
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){bk('コピーしました。メモアプリなどに貼り付けて保管できます。');},function(){bk('コピーできませんでした。');});
      else bk('この画面ではコピーできませんでした。');return;}
    if(e.target.id==='dlCsv'){try{var blob=new Blob([allCsv()],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ジム記録_'+TODAY+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);bk('CSVファイルを保存しました。GoogleスプレッドシートやExcelで開けます。');}catch(err){bk('保存できませんでした。');}return;}
    if(e.target.id==='doImport'&&pendingImport){var p=pendingImport;pendingImport=null;state.days=p.days;state.logs=p.logs;normalize();
      Object.keys(p.days).forEach(function(k){p.days[k].forEach(function(x){if(state.parts.indexOf(x)<0)state.parts.push(x);});});state.sample=false;closeForm();changed();bk('読み込みました。');return;}
    if(e.target.id==='cancelImport'){pendingImport=null;render();return;}
  });
  // Keep what is being typed in a draft so re-renders don't lose it; show the previous record for the exercise
  document.addEventListener('input',function(e){var t=e.target;
    if(t.id==='e-n'){draft.n=t.value.trim();var ch=document.querySelectorAll('#exChips .chip');for(var ci=0;ci<ch.length;ci++){var on=ch[ci].dataset.ex===draft.n;ch[ci].classList.toggle('on',on);ch[ci].setAttribute('aria-pressed',on);}if(editIdx<0)document.getElementById('e-prev').innerHTML=prevHtml();return;}
    if(t.id==='e-memo'){draft.memo=t.value;return;}
    if(t.dataset&&t.dataset.si!=null){draft.sets[+t.dataset.si][t.dataset.sf]=t.value;}
  });
  function focusSet(i){var el=document.getElementById('s-kg-'+i);if(el)el.focus();}
  document.addEventListener('submit',function(e){
    if(e.target.id==='entForm'){e.preventDefault();
      var n=draft.n||document.getElementById('e-n').value.trim();if(!n){var en=document.getElementById('e-n');if(en){en.focus();en.placeholder='種目を選ぶか、名前を入れてください';}return;}var it={n:n};
      if(state.exercises.indexOf(n)<0)state.exercises.push(n);
      var ss=draft.sets.filter(function(x){return String(x.kg).trim()!==''||String(x.r).trim()!=='';}).map(function(x){var o={};if(String(x.kg).trim()!=='')o.kg=+x.kg;if(String(x.r).trim()!=='')o.r=+x.r;return o;});
      if(ss.length)it.sets=ss;if(draft.memo.trim())it.memo=draft.memo.trim();
      var l=state.logs[sel]=state.logs[sel]||[];
      if(editIdx>=0)l[editIdx]=it;else l.push(it);
      closeForm();changed();return;}
    if(e.target.id==='renForm'){e.preventDefault();var nn=document.getElementById('renName').value.trim(),old=exSel;renaming=false;
      if(!nn||nn===old){render();return;}
      Object.keys(state.logs).forEach(function(k){state.logs[k].forEach(function(x){if(x.n===old)x.n=nn;});});
      var ix=state.exercises.indexOf(old);if(state.exercises.indexOf(nn)>=0)state.exercises.splice(ix,1);else state.exercises[ix]=nn;
      if(draft.n===old)draft.n=nn;exSel=nn;changed();return;}
    if(e.target.id!=='addForm')return;e.preventDefault();
    var v=document.getElementById('newPart').value.trim();adding=false;
    if(v){if(state.parts.indexOf(v)<0)state.parts.push(v);var a=state.days[sel];if(a&&a.indexOf(v)<0)a.push(v);changed();}else render();
  });
  start();
})();
</script>
</body>
</html>
